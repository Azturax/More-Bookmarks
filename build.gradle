plugins {
	id "fabric-loom" version "${loom_version}"
	id "maven-publish"
}

version = project.mod_version
group = project.maven_group

base {
	archivesName = project.archives_base_name
}

repositories {
	maven {
		name = "TerraformersMC"
		url = "https://maven.terraformersmc.com/"
	}
	maven {
		name = "Shedaniel"
		url = "https://maven.shedaniel.me/"
	}
	maven {
		name = "BlameJared"
		url = "https://maven.blamejared.com/"
	}
	maven {
		name = "ModMaven"
		url = "https://modmaven.dev/"
	}
	maven {
		name = "Architectury"
		url = "https://maven.architectury.dev/"
	}
}

loom {
	runs {
		client {
			ideConfigGenerated true
			runDir "run"
		}
	}
}

dependencies {
	minecraft "com.mojang:minecraft:${project.minecraft_version}"
	mappings "net.fabricmc:yarn:${project.yarn_mappings}:v2"
	modImplementation "net.fabricmc:fabric-loader:${project.loader_version}"
	modImplementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_version}"

	// Full EMI jar: mixins target internals (EmiScreenManager). Optional at runtime.
	modCompileOnly "dev.emi:emi-fabric:${project.emi_version}"
	modLocalRuntime "dev.emi:emi-fabric:${project.emi_version}"

	// Intermediary common API only — official-mapped JEI jars clash with Yarn on the compile classpath.
	modCompileOnly "mezz.jei:jei-1.21.1-common-api-intermediary:${project.jei_version}"
	modCompileOnly "me.shedaniel:RoughlyEnoughItems-api-fabric:${project.rei_version}"
	modCompileOnly "me.shedaniel:RoughlyEnoughItems-fabric:${project.rei_version}"

	modImplementation("me.shedaniel.cloth:cloth-config-fabric:${project.cloth_config_version}") {
		exclude group: "net.fabricmc.fabric-api"
	}
	modCompileOnly "com.terraformersmc:modmenu:${project.mod_menu_version}"
}

processResources {
	inputs.property "version", project.version
	inputs.file("src/main/resources/fabric.mod.json")

	filesMatching("fabric.mod.json") {
		expand "version": project.version
	}

	doLast {
		def fmj = file("${destinationDir}/fabric.mod.json")
		if (!fmj.exists()) {
			throw new GradleException("processResources did not write fabric.mod.json")
		}
		def parsed = new groovy.json.JsonSlurper().parse(fmj)
		if (parsed.depends != null && parsed.depends.containsKey("emi")) {
			throw new GradleException("fabric.mod.json still has depends.emi — EMI must be recommends/suggests only")
		}
	}
}

tasks.withType(JavaCompile).configureEach {
	it.options.release = 21
	it.options.encoding = "UTF-8"
}

java {
	withSourcesJar()
	sourceCompatibility = JavaVersion.VERSION_21
	targetCompatibility = JavaVersion.VERSION_21
}

jar {
	from("LICENSE") {
		rename { "${it}_${project.base.archivesName.get()}" }
	}
}

publishing {
	publications {
		create("mavenJava", MavenPublication) {
			from components.java
		}
	}
}
